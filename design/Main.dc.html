<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Inter', system-ui, sans-serif; }
    a { color: #E2B340; } a:hover { color: #FACC15; }
    .ico { display: block; }
    .tool { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8A8A8A; border: 1px solid transparent; }
    .tool.on { background: rgba(250,204,21,0.1); border-color: #FACC15; color: #FACC15; }
    .rule { height: 1px; background: #2E2E2E; margin: 6px 4px; }
    .sec { color: #B8B8B8; font-size: 13px; font-weight: 500; }
    .chip { height: 34px; border-radius: 8px; background: #1E1E1E; border: 1px solid #363636; color: #B8B8B8; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .chip.on { background: rgba(250,204,21,0.1); border-color: #FACC15; color: #FACC15; }
  </style>
</helmet>

<div style="width: 1180px; height: 720px; background: #050505; color: #E8E8E8; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 상단 도구바 (현재와 동일) -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #0D0D0D; border-bottom: 1px solid #363636; flex-shrink: 0;">
    <div style="display: flex; gap: 6px;">
      <div style="padding: 8px 16px; background: #181818; border: 1px solid rgba(250,204,21,0.1); border-radius: 6px; color: #FACC15; font-size: 12px; font-weight: 600;">열기</div>
      <div style="padding: 8px 16px; background: #FACC15; border-radius: 6px; color: #000; font-size: 12px; font-weight: 800;">저장</div>
      <div style="padding: 8px 16px; background: #181818; border: 1px solid #363636; border-radius: 6px; color: #909090; font-size: 12px; font-weight: 600;">다른 이름</div>
      <div style="padding: 8px 16px; background: #181818; border: 1px solid #363636; border-radius: 6px; color: #909090; font-size: 12px; font-weight: 600;">붙여넣기</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="padding: 8px 16px; background: #181818; border: 1px solid #363636; border-radius: 6px; color: #909090; font-size: 12px; font-weight: 600;">Undo (3/20)</div>
      <div style="padding: 8px 16px; background: #181818; border: 1px solid #363636; border-radius: 6px; color: #909090; font-size: 12px; font-weight: 600;">Redo (0)</div>
      <span style="color: #333; margin: 0 4px;">|</span>
      <span style="color: #c8c8c8; font-size: 12px; font-weight: 600; padding: 0 8px;">2024-06-12_074512.png</span>
      <span style="color: #585858; font-size: 11px; font-family: Consolas, monospace;">1024×1536 · PNG · 2.4MB</span>
    </div>
    <div style="padding: 8px 16px; background: #181818; border: 1px solid rgba(248,113,113,0.2); border-radius: 6px; color: #f87171; font-size: 12px; font-weight: 600;">닫기</div>
  </div>

  <div style="flex: 1; display: flex; min-height: 0;">

    <!-- 세로 도구 툴바 48px -->
    <div style="width: 48px; flex-shrink: 0; background: #0A0A0A; border-right: 1px solid #2E2E2E; display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 2px;">
      <!-- 선택 -->
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h15v15h-15z" stroke-dasharray="3 3"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5c5 0 8 2.6 8 5.8 0 3.3-3.6 5.7-8 5.7-2 0-3.4-.3-4.6-.9" stroke-dasharray="3 3"/><path d="M7.4 15.1c-1 1.4-1.2 2.6-.6 3.4"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1L19 8.5 15.5 5 5 15.5z"/><path d="M14.5 6l3.5 3.5"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20.5h12"/><path d="M15.5 4.5l4.5 4.5-9 9H7l-2.5-2.5z"/></svg></div>
      <div class="rule" style="width: 30px;"></div>

      <!-- 그리기 (펜 선택됨) -->
      <div class="tool on"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1L19 8.5 15.5 5 5 15.5z"/><path d="M14.5 6l3.5 3.5"/><path d="M5 19.5l2-.5"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14v11h-14z"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l8 8-7 7-8-8z"/><path d="M19.5 15.5c0 1.4-.9 2.5-2 2.5s-2-1.1-2-2.5 2-3.5 2-3.5 2 2.1 2 3.5"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 4.5l1.5 1.5-9 9-2 .5.5-2z"/><path d="M9.5 13.5L5 18v2h2l4.5-4.5"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6.5h11v13h-11z"/><path d="M15.5 6.5V4.5h-11v13h2"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h15v15h-15z"/><path d="M4.5 14.5l15-8"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l10.5-10.5"/><path d="M17 4v3.5"/><path d="M17 10.5V14"/><path d="M13.5 9h3.5"/><path d="M20.5 9H17"/></svg></div>
      <div class="rule" style="width: 30px;"></div>

      <!-- 변형 -->
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2.5v15h15"/><path d="M2.5 6.5h15v15"/></svg></div>
      <div class="tool"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M4 12h16"/><path d="M9 7l3-3 3 3"/><path d="M9 17l3 3 3-3"/><path d="M7 9l-3 3 3 3"/><path d="M17 9l3 3-3 3"/></svg></div>
    </div>

    <!-- 사이드 패널 280px -->
    <div style="width: 280px; flex-shrink: 0; background: #0D0D0D; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #2E2E2E;">

      <!-- 도구 옵션 (툴바에서 고른 도구를 따라간다) -->
      <div style="padding: 10px 12px; border-bottom: 1px solid #2E2E2E; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span class="sec">펜 도구</span>
          <span style="color: #8A8A8A; font-size: 11px;">P</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="color: #B0B0B0; font-size: 12px; min-width: 46px;">색</span>
          <div style="width: 26px; height: 26px; border-radius: 6px; background: #12B886; border: 1px solid #666;"></div>
          <div style="display: flex; gap: 4px; flex: 1;">
            <div style="flex: 1; height: 26px; border-radius: 6px; background: #000; border: 1px solid #363636;"></div>
            <div style="flex: 1; height: 26px; border-radius: 6px; background: #fff; border: 1px solid #363636;"></div>
            <div style="flex: 1; height: 26px; border-radius: 6px; background: #E03131; border: 1px solid #363636;"></div>
            <div style="flex: 1; height: 26px; border-radius: 6px; background: #1971C2; border: 1px solid #363636;"></div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="color: #B0B0B0; font-size: 12px; min-width: 46px;">크기</span>
          <div style="flex: 1; height: 4px; background: #2A2A2A; border-radius: 2px; position: relative;"><div style="position: absolute; left: 0; top: 0; height: 4px; width: 30%; background: #E2B340; border-radius: 2px;"></div><div style="position: absolute; left: 30%; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #E2B340;"></div></div>
          <span style="color: #E8E8E8; font-size: 12px; min-width: 24px; text-align: right;">8</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="color: #B0B0B0; font-size: 12px; min-width: 46px;">투명도</span>
          <div style="flex: 1; height: 4px; background: #2A2A2A; border-radius: 2px; position: relative;"><div style="position: absolute; left: 0; top: 0; height: 4px; width: 100%; background: #E2B340; border-radius: 2px;"></div><div style="position: absolute; left: calc(100% - 16px); top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #E2B340;"></div></div>
          <span style="color: #E8E8E8; font-size: 12px; min-width: 24px; text-align: right;">100</span>
        </div>
      </div>

      <!-- 탭 3개 -->
      <div style="display: flex; gap: 4px; padding: 8px; background: #0A0A0A;">
        <div style="flex: 1; height: 32px; background: #1A1A1A; border-radius: 6px; color: #E2B340; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">보정</div>
        <div style="flex: 1; height: 32px; background: #131313; border-radius: 6px; color: #8A8A8A; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">효과</div>
        <div style="flex: 1; height: 32px; background: #131313; border-radius: 6px; color: #8A8A8A; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">변형</div>
      </div>

      <!-- 보정 탭 내용 — 접이식 -->
      <div style="flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 6px; height: 28px;">
          <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>
          <span class="sec">히스토그램 · 레벨</span>
        </div>
        <div style="height: 74px; background: #050505; border: 1px solid #2E2E2E; border-radius: 8px; position: relative; overflow: hidden;">
          <div style="position: absolute; left: 8%; bottom: 0; width: 3px; height: 62px; background: #D95C5C;"></div>
          <div style="position: absolute; left: 15%; bottom: 0; width: 3px; height: 70px; background: #5CC97C;"></div>
          <div style="position: absolute; left: 27%; bottom: 0; width: 3px; height: 55px; background: #6797DC;"></div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(to top, rgba(230,230,230,0.42), rgba(230,230,230,0.05));"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="color: #B0B0B0; font-size: 12px; min-width: 62px;">블랙</span>
          <div style="flex: 1; height: 4px; background: #2A2A2A; border-radius: 2px; position: relative;"><div style="position: absolute; left: 0; top: 0; height: 4px; width: 12%; background: #E2B340; border-radius: 2px;"></div><div style="position: absolute; left: 12%; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #E2B340;"></div></div>
          <span style="color: #E8E8E8; font-size: 12px; min-width: 26px; text-align: right;">30</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="color: #B0B0B0; font-size: 12px; min-width: 62px;">화이트</span>
          <div style="flex: 1; height: 4px; background: #2A2A2A; border-radius: 2px; position: relative;"><div style="position: absolute; left: 0; top: 0; height: 4px; width: 88%; background: #E2B340; border-radius: 2px;"></div><div style="position: absolute; left: calc(88% - 8px); top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #E2B340;"></div></div>
          <span style="color: #E8E8E8; font-size: 12px; min-width: 26px; text-align: right;">225</span>
        </div>

        <div style="height: 1px; background: #2E2E2E; margin: 2px 0;"></div>
        <div style="display: flex; align-items: center; gap: 6px; height: 28px;">
          <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg>
          <span class="sec">커브</span>
        </div>
        <div style="height: 1px; background: #2E2E2E;"></div>
        <div style="display: flex; align-items: center; gap: 6px; height: 28px;">
          <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg>
          <span class="sec">색온도 · 채도</span>
        </div>
        <div style="height: 1px; background: #2E2E2E;"></div>
        <div style="display: flex; align-items: center; gap: 6px; height: 28px;">
          <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg>
          <span class="sec">필터 프리셋</span>
        </div>

        <div style="flex: 1;"></div>
        <div style="display: flex; gap: 6px;">
          <div style="flex: 2; height: 36px; background: #FACC15; border-radius: 6px; color: #000; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">적용</div>
          <div style="flex: 1; height: 36px; background: #1E1E1E; border: 1px solid #363636; border-radius: 6px; color: #B8B8B8; font-size: 13px; display: flex; align-items: center; justify-content: center;">초기화</div>
        </div>
      </div>
    </div>

    <!-- 캔버스 -->
    <div style="flex: 1; background: #111; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="width: 300px; height: 450px; background: linear-gradient(160deg, #2b3550 0%, #4a3a55 55%, #6b4a52 100%); border-radius: 2px;"></div>
      <div style="position: absolute; bottom: 8px; right: 12px; color: #585858; font-size: 11px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px;">1024 × 1536 | 100% | 0°</div>
    </div>
  </div>

  <!-- 효과 배지 -->
  <div style="position: absolute; left: 344px; top: 56px; display: flex; flex-direction: column; gap: 6px;">
    <div style="background: rgba(74,222,128,0.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">패널 한 화면 안에 — 스크롤 없음</div>
    <div style="background: rgba(74,222,128,0.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">도구 15종 상시 노출 · 탭 전환 불필요</div>
    <div style="background: rgba(74,222,128,0.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">최소 타격 28px · 본문 12px 이상</div>
  </div>

</div>
</x-dc>
</body>
</html>
