<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Pretendard', system-ui, sans-serif; }
    a { color: #C9B98A; } a:hover { color: #DCCB9C; }
    .num { font-family: 'IBM Plex Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 420px; height: 780px; background: #060606; box-sizing: border-box; padding: 20px 30px; display: flex; flex-direction: column; gap: 12px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 11px; font-weight: 500; color: #C9A227;">B안</div>
    <div style="font-size: 16px; font-weight: 600; color: #E4E4E4;">자주 쓰는 것만 앞으로</div>
  </div>

  <div style="width: 360px; background: #0A0A0A; border: 1px solid #242424; box-sizing: border-box; display: flex; flex-direction: column;">

    <div style="height: 168px; border-bottom: 1px solid #242424; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box;">
      <div style="font-size: 13px; font-weight: 500; color: #A2A2A2;">최종 프롬프트</div>
      <div style="flex: 1; background: #131313; border: 1px solid #242424; border-radius: 6px;"></div>
    </div>

    <div style="padding: 12px; display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 30px; height: 17px; background: #C9A227; border-radius: 9px; position: relative;"><span style="position: absolute; right: 2px; top: 2px; width: 13px; height: 13px; background: #0A0A0A; border-radius: 50%;"></span></span>
        <span style="font-size: 13px; font-weight: 500; color: #E4E4E4;">자동 생성</span>
      </div>

      <!-- 얼마나 — 칩 하나로 끝나는 경우가 대부분 -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 11px; color: #8A8A8A;">얼마나</div>
        <div style="display: flex; gap: 6px;">
          <span style="flex: 1; height: 30px; background: #1E1E1E; border: 1px solid #242424; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A2A2A2;">10장</span>
          <span style="flex: 1; height: 30px; background: rgba(201,162,39,0.14); border: 1px solid #C9A227; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #C9A227;">50장</span>
          <span style="flex: 1; height: 30px; background: #1E1E1E; border: 1px solid #242424; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A2A2A2;">1시간</span>
          <span style="flex: 1; height: 30px; background: #1E1E1E; border: 1px solid #242424; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A2A2A2;">무제한</span>
        </div>
      </div>

      <!-- 사이 간격 -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 11px; color: #8A8A8A; width: 56px;">사이 간격</span>
        <div style="flex: 1; height: 30px; background: #131313; border: 1px solid #242424; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; box-sizing: border-box; font-size: 12px; color: #E4E4E4;" class="num">1.0 초</div>
      </div>

      <!-- 덱 — 한 번만 그린다 -->
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #0D0D0D; border-left: 2px solid #C9A227; box-sizing: border-box;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.6"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 4h14v12"/></svg>
        <span style="font-size: 12px; color: #A2A2A2;">덱 <strong class="num" style="color:#E4E4E4;">120</strong> / 120</span>
        <span style="margin-left: auto; font-size: 11px; color: #8A8A8A;">비우면 다시 채움</span>
      </div>

      <!-- 고급 — 접혀 있다 -->
      <div style="display: flex; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid #242424;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        <span style="font-size: 12px; color: #A2A2A2;">고급</span>
        <span style="margin-left: auto; font-size: 11px; color: #8A8A8A;" class="num">반복 1 · 재시도 2 · 중복 끔</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: #A2A2A2;">
        <span style="width: 26px; height: 15px; background: #242424; border-radius: 8px;"></span>
        <span>생성 시 태그를 자연어로 변환</span>
      </div>

      <div style="height: 40px; background: #C9A227; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: #0A0A0A;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#0A0A0A" stroke="none"><path d="M7 4l13 8-13 8z"/></svg>
        자동 생성 시작
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A2A2A2; line-height: 1.5;">
    <div style="color: #4ADE80; font-weight: 500;">얻는 것</div>
    <div>대부분은 칩 하나 누르고 끝난다. 안 만지는 넷(반복·재시도·cleanup·중복)은 접히되 값은 한 줄로 보인다.</div>
    <div style="color: #E0B341; font-weight: 500; margin-top: 4px;">치르는 것</div>
    <div>여전히 패널 안이라 프롬프트 영역을 조금 먹는다. 프리셋에 없는 숫자는 고급을 열어야 한다.</div>
  </div>

</div>
</x-dc>
</body>
</html>
