<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Inter', system-ui, sans-serif; }
    a { color: #E2B340; } a:hover { color: #FACC15; }
    .lbl { color: #8A8A8A; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
    .sec { color: #E8E8E8; font-size: 13px; font-weight: 500; }
    .chip { height: 32px; border-radius: 8px; background: #1E1E1E; border: 1px solid #363636; color: #B8B8B8; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .chip.on { background: rgba(250,204,21,.1); border-color: #FACC15; color: #FACC15; }
    .fld { height: 34px; background: #181818; border: 1px solid #363636; border-radius: 8px; }
  </style>
</helmet>

<div style="width: 1180px; height: 700px; background: #050505; color: #E8E8E8; display: flex; flex-direction: column; overflow: hidden;">
  <div style="height: 36px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #0D0D0D; border-bottom: 1px solid #363636; font-size: 12px; color: #8A8A8A; flex-shrink: 0;">
    <span style="color: #050505; background: #FACC15; padding: 4px 12px; border-radius: 999px; font-weight: 700;">Inpaint</span>
    <span>T2I</span><span>I2I</span><span>Event Gen</span><span>Search</span><span>Gallery</span>
  </div>

  <!-- 도구를 캔버스 위 가로 막대로 -->
  <div style="height: 46px; flex-shrink: 0; background: #0D0D0D; border-bottom: 1px solid #2E2E2E; display: flex; align-items: center; gap: 8px; padding: 0 12px;">
    <div style="display: flex; gap: 4px;">
      <div class="chip" style="width:70px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 4.5h15v15h-15z"/></svg>사각</div>
      <div class="chip" style="width:78px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 4.5c4.7 0 8 2.5 8 5.7 0 3.2-3.6 5.8-8 5.8-2 0-3.6-.3-4.9-1"/></svg>올가미</div>
      <div class="chip on" style="width:82px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15.5c-1.7.6-2 2.4-2 4.5 2.1 0 3.9-.3 4.5-2"/><path d="M8.5 18l10-10a2.5 2.5 0 0 0-3.5-3.5l-10 10"/></svg>브러시</div>
      <div class="chip" style="width:78px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20.5h12"/><path d="M15.5 4.5l4.5 4.5-9 9H7l-2.5-2.5z"/></svg>지우개</div>
    </div>
    <div style="width:1px;height:24px;background:#2E2E2E;margin:0 4px"></div>
    <span style="color:#B0B0B0;font-size:12px">크기</span>
    <div style="width:130px;height:4px;background:#2A2A2A;border-radius:2px;position:relative"><div style="position:absolute;left:0;top:0;height:4px;width:35%;background:#E2B340;border-radius:2px"></div><div style="position:absolute;left:35%;top:-6px;width:16px;height:16px;border-radius:50%;background:#E2B340"></div></div>
    <span style="color:#E8E8E8;font-size:12px;min-width:26px">40</span>
    <div style="width:1px;height:24px;background:#2E2E2E;margin:0 4px"></div>
    <div style="display:flex;gap:4px">
      <div class="chip" style="width:60px;font-size:12px">비우기</div>
      <div class="chip" style="width:36px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L4.5 12l4 4"/><path d="M4.5 12h10a4.5 4.5 0 0 1 0 9h-3"/></svg></div>
      <div class="chip" style="width:36px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12h-10a4.5 4.5 0 0 0 0 9h3"/></svg></div>
    </div>
    <div style="flex:1"></div>
    <div style="height: 32px; padding: 0 18px; background: #FACC15; border-radius: 8px; color: #000; font-size: 12px; font-weight: 800; display: flex; align-items: center;">인페인트 실행</div>
  </div>

  <div style="flex: 1; display: flex; min-height: 0;">
    <!-- 캔버스가 먼저 -->
    <div style="flex: 1; background: #111; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="width: 380px; height: 550px; background: linear-gradient(160deg,#2b3550,#4a3a55 55%,#6b4a52); border-radius: 2px; position: relative;">
        <div style="position:absolute;left:105px;top:175px;width:150px;height:140px;background:rgba(250,204,21,.28);border:1px solid rgba(250,204,21,.6);border-radius:40% 55% 45% 50%"></div>
      </div>
      <div style="position: absolute; bottom: 8px; right: 12px; color: #585858; font-size: 11px; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 4px;">마스크 1개 · 1024 × 1536</div>
    </div>

    <!-- 설정은 오른쪽 한 열로 -->
    <div style="width: 300px; flex-shrink: 0; background: #0D0D0D; border-left: 1px solid #2E2E2E; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display:flex;align-items:center;gap:6px;height:28px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>
        <span class="sec">인페인트</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:#B0B0B0;font-size:12px;min-width:52px">디노이징</span>
        <div style="flex:1;height:4px;background:#2A2A2A;border-radius:2px;position:relative"><div style="position:absolute;left:0;top:0;height:4px;width:75%;background:#E2B340;border-radius:2px"></div><div style="position:absolute;left:75%;top:-6px;width:16px;height:16px;border-radius:50%;background:#E2B340"></div></div>
        <span style="color:#E8E8E8;font-size:12px;min-width:32px;text-align:right">0.75</span>
      </div>
      <div class="lbl">마스크 채움</div>
      <div class="fld"></div>
      <div class="lbl">이 영역에만 적용할 프롬프트</div>
      <div style="height: 60px; background: #181818; border: 1px solid #363636; border-radius: 8px;"></div>

      <div style="height:1px;background:#2E2E2E;margin-top:2px"></div>
      <div style="display:flex;align-items:center;gap:6px;height:28px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>
        <span class="sec">공통 프롬프트</span>
        <span style="color:#8A8A8A;font-size:11px;margin-left:auto">T2I 와 공유</span>
      </div>
      <div style="height: 54px; background: #181818; border: 1px solid #363636; border-radius: 8px;"></div>
      <div style="display:flex;gap:6px"><div class="chip" style="flex:1">OPTIMIZE</div><div class="chip" style="flex:1">분류</div></div>
      <div style="color:#f87171;font-size:12px;font-weight:700">NEGATIVE</div>
      <div class="fld"></div>
      <div style="flex:1"></div>
      <div class="lbl">HISTORY</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">
        <div style="aspect-ratio:1;background:#181818;border:1px solid #2E2E2E;border-radius:6px"></div>
        <div style="aspect-ratio:1;background:#181818;border:1px solid #2E2E2E;border-radius:6px"></div>
        <div style="aspect-ratio:1;background:#181818;border:1px solid #2E2E2E;border-radius:6px"></div>
        <div style="aspect-ratio:1;background:#181818;border:1px solid #2E2E2E;border-radius:6px"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; top: 96px; display: flex; flex-direction: column; gap: 6px;">
    <div style="background: rgba(74,222,128,.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">캔버스가 가장 넓다 — 마스크를 칠하는 일이 주인공</div>
    <div style="background: rgba(74,222,128,.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">도구·크기·실행이 한 줄 — 손이 위에서만 움직인다</div>
    <div style="background: rgba(226,179,64,.12); border: 1px solid #E2B340; border-radius: 6px; padding: 6px 10px; color: #E2B340; font-size: 12px; font-weight: 700;">대가 — 다른 탭은 왼쪽 패널인데 여기만 오른쪽이다</div>
  </div>
</div>
</x-dc>
</body>
</html>
