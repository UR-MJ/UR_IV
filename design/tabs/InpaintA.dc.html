<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Inter', system-ui, sans-serif; }
    a { color: #E2B340; } a:hover { color: #FACC15; }
    .lbl { color: #8A8A8A; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
    .sec { color: #E8E8E8; font-size: 13px; font-weight: 500; }
    .chip { height: 30px; border-radius: 8px; background: #1E1E1E; border: 1px solid #363636; color: #B8B8B8; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .chip.on { background: rgba(250,204,21,.1); border-color: #FACC15; color: #FACC15; }
    .tool { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8A8A8A; border: 1px solid transparent; }
    .tool.on { background: rgba(250,204,21,.1); border-color: #FACC15; color: #FACC15; }
    .fld { height: 34px; background: #181818; border: 1px solid #363636; border-radius: 8px; }
  </style>
</helmet>

<div style="width: 1180px; height: 700px; background: #050505; color: #E8E8E8; display: flex; flex-direction: column; overflow: hidden;">
  <div style="height: 36px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #0D0D0D; border-bottom: 1px solid #363636; font-size: 12px; color: #8A8A8A; flex-shrink: 0;">
    <span style="color: #050505; background: #FACC15; padding: 4px 12px; border-radius: 999px; font-weight: 700;">Inpaint</span>
    <span>T2I</span><span>I2I</span><span>Event Gen</span><span>Search</span><span>Gallery</span>
  </div>

  <div style="flex: 1; display: flex; min-height: 0;">
    <!-- 마스크 도구 툴바 — 에디터와 같은 문법 -->
    <div style="width: 48px; flex-shrink: 0; background: #0A0A0A; border-right: 1px solid #2E2E2E; display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 2px;">
      <div class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h15v15h-15z"/></svg></div>
      <div class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5c4.7 0 8 2.5 8 5.7 0 3.2-3.6 5.8-8 5.8-2 0-3.6-.3-4.9-1"/><path d="M7.1 15c-1 1.4-1.2 2.7-.4 3.5.7.7 1.9.4 2.3-.5"/></svg></div>
      <div class="tool on"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15.5c-1.7.6-2 2.4-2 4.5 2.1 0 3.9-.3 4.5-2"/><path d="M8.5 18l10-10a2.5 2.5 0 0 0-3.5-3.5l-10 10"/></svg></div>
      <div class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20.5h12"/><path d="M15.5 4.5l4.5 4.5-9 9H7l-2.5-2.5z"/></svg></div>
      <div style="width:30px;height:1px;background:#2E2E2E;margin:6px 0"></div>
      <div class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L4.5 12l4 4"/><path d="M4.5 12h10a4.5 4.5 0 0 1 0 9h-3"/></svg></div>
      <div class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 8l4 4-4 4"/><path d="M19.5 12h-10a4.5 4.5 0 0 0 0 9h3"/></svg></div>
      <div class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15"/><path d="M9.5 7V4h5v3"/><path d="M6.5 7l1 13h9l1-13"/></svg></div>
    </div>

    <!-- 패널 하나 — 도구 옵션 위, 생성 설정 아래 -->
    <div style="width: 300px; flex-shrink: 0; background: #0D0D0D; border-right: 1px solid #2E2E2E; display: flex; flex-direction: column; overflow: hidden;">
      <div style="padding: 10px 12px; border-bottom: 1px solid #2E2E2E; display: flex; flex-direction: column; gap: 8px;">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="sec">마스크 브러시</span><span style="color:#8A8A8A;font-size:11px;border:1px solid #2E2E2E;background:#1E1E1E;border-radius:3px;padding:1px 5px">B</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:#B0B0B0;font-size:12px;min-width:38px">크기</span>
          <div style="flex:1;height:4px;background:#2A2A2A;border-radius:2px;position:relative"><div style="position:absolute;left:0;top:0;height:4px;width:35%;background:#E2B340;border-radius:2px"></div><div style="position:absolute;left:35%;top:-6px;width:16px;height:16px;border-radius:50%;background:#E2B340"></div></div>
          <span style="color:#E8E8E8;font-size:12px;min-width:28px;text-align:right">40</span>
        </div>
      </div>

      <div style="flex:1; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
        <div style="display:flex;align-items:center;gap:6px;height:28px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>
          <span class="sec">인페인트 설정</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:#B0B0B0;font-size:12px;min-width:52px">디노이징</span>
          <div style="flex:1;height:4px;background:#2A2A2A;border-radius:2px;position:relative"><div style="position:absolute;left:0;top:0;height:4px;width:75%;background:#E2B340;border-radius:2px"></div><div style="position:absolute;left:75%;top:-6px;width:16px;height:16px;border-radius:50%;background:#E2B340"></div></div>
          <span style="color:#E8E8E8;font-size:12px;min-width:32px;text-align:right">0.75</span>
        </div>
        <div class="lbl">마스크 채움</div>
        <div class="fld"></div>
        <div class="lbl">이 영역에만 적용할 프롬프트</div>
        <div style="height: 60px; background: #181818; border: 1px solid #363636; border-radius: 8px;"></div>

        <div style="height:1px;background:#2E2E2E"></div>
        <div style="display:flex;align-items:center;gap:6px;height:28px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg>
          <span class="sec">공통 프롬프트 · 모델</span>
          <span style="color:#8A8A8A;font-size:11px;margin-left:auto">T2I 와 공유</span>
        </div>
        <div style="height:1px;background:#2E2E2E"></div>

        <div style="flex:1"></div>
        <div style="height: 42px; background: #FACC15; border-radius: 8px; color: #000; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z"/></svg>
          인페인트 실행
        </div>
      </div>
    </div>

    <!-- 캔버스 -->
    <div style="flex: 1; background: #111; display: flex; align-items: center; justify-content: center; position: relative;">
      <div style="width: 330px; height: 480px; background: linear-gradient(160deg,#2b3550,#4a3a55 55%,#6b4a52); border-radius: 2px; position: relative;">
        <div style="position:absolute;left:90px;top:150px;width:130px;height:120px;background:rgba(250,204,21,.28);border:1px solid rgba(250,204,21,.6);border-radius:40% 55% 45% 50%"></div>
      </div>
      <div style="position: absolute; bottom: 8px; right: 12px; color: #585858; font-size: 11px; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 4px;">마스크 1개 · 1024 × 1536</div>
    </div>

    <div style="width: 138px; flex-shrink: 0; background: #0D0D0D; border-left: 1px solid #2E2E2E; padding: 10px;">
      <div class="lbl">HISTORY</div>
    </div>
  </div>

  <div style="position: absolute; left: 360px; top: 60px; display: flex; flex-direction: column; gap: 6px;">
    <div style="background: rgba(74,222,128,.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">에디터와 같은 조작법 — 도구는 툴바, 옵션은 그 아래</div>
    <div style="background: rgba(74,222,128,.12); border: 1px solid #4ade80; border-radius: 6px; padding: 6px 10px; color: #4ade80; font-size: 12px; font-weight: 700;">열 셋 → 둘. 캔버스가 넓어진다</div>
    <div style="background: rgba(226,179,64,.12); border: 1px solid #E2B340; border-radius: 6px; padding: 6px 10px; color: #E2B340; font-size: 12px; font-weight: 700;">대가 — 공통 프롬프트가 접혀 한 번 더 눌러야 보인다</div>
  </div>
</div>
</x-dc>
</body>
</html>
